folder: pll
description: SRF-PLL: teoria, sintonia do PI do laço, comportamento sob contingência e tentativa (descartada) de notch
files: []
subfolders:
  - folder: teoria
    description: Fundamentos do SRF-PLL — estrutura, modelo linear e PLL como inércia reativa (dualidade GFL/GFM)
    files:
      - file: srf_pll_theory.md
        name: srf-pll-theory
        description: "Teoria do SRF-PLL — estrutura, modelo linear, projeto de ganhos (Karimi-Ghartemani cap.6)"
      - file: pll_reactive_inertia.md
        name: pll-reactive-inertia
        description: "PLL como \"inércia reativa\" e dualidade Q-δi (GFL) vs P-δv (síncronos/GFM) — framework estendido de estabilidade de sistemas com alta penetração de IBR"
  - folder: sintonia
    description: Ganhos do PI do PLL (kp_pll/ki_pll): projeto, critério de ts, procedência PSIM→Simulink, dependência com a tensão; e o alerta de que Kp=8·fg·Lest é do controlador de corrente
    files:
      - file: pll_loop_filter_gains.md
        name: pll-loop-filter-gains
        description: "Ganhos do PI do laço do SRF-PLL (kp_pll=460, ki_pll=105820) — projeto de 2ª ordem por tempo de acomodação, ts=20 ms pelo critério de 1% (Teodorescu eq. 4.38 / Alves 2020 eqs. 9-11), ωn=325,3 e ξ=0,707"
      - file: pll_ts_criterion_rationale.md
        name: pll-ts-criterion-rationale
        description: "Defesa da escolha do critério de 1% (numerador 4,6) na sintonia do SRF-PLL — argumento a favor, argumento contra (15% mais ripple de 2ω₀) e como redigir isso no TCC"
      - file: pll_gains_provenance.md
        name: pll-gains-provenance
        description: "Procedência dos ganhos do SRF-PLL — literais hardcoded no netlist PSIM, cadeia PSIM→Simulink→params.m, e a dedução de que o laço está normalizado (U = 1 pu)"
      - file: pll_gains_methodology.md
        name: pll-gains-methodology
        description: "Metodologia TeseAGP (Kp=8·fg·Lest) dos ganhos do CONTROLADOR DE CORRENTE — não é o ganho do PLL, ver pll_loop_filter_gains.md"
      - file: pll_gain_voltage_dependence.md
        name: pll-gain-voltage-dependence
        description: "A sintonia do SRF-PLL degrada com a profundidade do afundamento (ωn e ξ ∝ √U) porque o laço é normalizado por constante — equivalência algébrica exata entre o cenário BAD_PLL e o PLL nominal sob U = 0,2 pu"
  - folder: contingencias
    description: PLL sob falta — cenários simulados, análise formal de falta assimétrica (ripple 2ω₀) e medição de escorregamento de ciclo
    files:
      - file: pll_contingencies.md
        name: pll-contingencies
        description: "Os 4 cenários de contingência simulados, efeitos no SRF-PLL e métricas de avaliação"
      - file: pll_asymmetric_fault_formal_analysis.md
        name: pll-asymmetric-fault-formal-analysis
        description: "Análise formal do SRF-PLL sob falta assimétrica (Yazdani-Iravani §12.5.2) — equações da sequência negativa, ripple de 2ω₀ e mitigação por feed-forward"
      - file: pll_cycle_slip_measurement.md
        name: pll-cycle-slip-measurement
        description: "Receita de medição do escorregamento de ciclo (cycle slipping) do SRF-PLL — arctan2+unwrap sobre vd/vq, com verificação cruzada via ângulos gravados pelo modelo"
  - folder: notch
    description: Notch de 120 Hz testado em 2026-05 e removido do modelo — registro histórico, não estado atual
    files:
      - file: pll_notch_implementation.md
        name: pll-notch-implementation
        description: "Notch de 120 Hz no laco do SRF-PLL - testado em 2026-05, removido do modelo final (2026-07) por ser desnecessario. Registro historico da tentativa, nao o estado atual."
      - file: pll_notch_integration.md
        name: pll-notch-integration
        description: "Onde o notch de 120 Hz entraria no SRF-PLL (dentro do laço vs. por fora), relação com o modelo do projeto e resultado das tentativas de 2026-05 (HISTÓRICO, removido do modelo)"
