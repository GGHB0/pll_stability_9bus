<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 720 345" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <!-- Controle de corrente em dq, no estilo da Fig. 8.10 de Yazdani & Iravani (2010),
       só com o que o modelo tem (subsistema PWM Control, SID 3974): PI (Kp/4, Ki/4)
       + notch por eixo. Sem desacoplamento ωL, sem v_g (pedido do Victor, 2026-10-02:
       "só deixa o que realmente está no nosso controlador"). -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0B132B"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1971c2"/>
    </marker>
    <g id="sum"><circle r="11" fill="#ffffff" stroke="#0B132B" stroke-width="1.8"/></g>
  </defs>
  <rect y="30" width="720" height="345" fill="#ffffff"/>

  <g font-size="15" fill="#0B132B">
    <!-- ===================== eixo d (y = 110) ===================== -->
    <text x="12" y="104" font-style="italic">i<tspan baseline-shift="sub" font-size="75%">d,ref</tspan></text>
    <line x1="58" y1="110" x2="87" y2="110" stroke="#0B132B" stroke-width="1.5" marker-end="url(#arr)"/>
    <use href="#sum" x="100" y="110"/>
    <text x="76" y="104" font-size="13" font-weight="700">+</text>
    <text x="106" y="92" font-size="15" font-weight="700">−</text>
    <line x1="111" y1="110" x2="139" y2="110" stroke="#0B132B" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="125" y="96" font-size="13" font-style="italic" text-anchor="middle">e<tspan baseline-shift="sub" font-size="75%">d</tspan></text>
    <rect x="140" y="88" width="130" height="44" rx="5" fill="#fff4e6" stroke="#F97316" stroke-width="2"/>
    <text x="205" y="116" text-anchor="middle" font-style="italic">K<tspan baseline-shift="sub" font-size="75%">p</tspan>/4 + K<tspan baseline-shift="sub" font-size="75%">i</tspan>/(4s)</text>
    <line x1="270" y1="110" x2="291" y2="110" stroke="#0B132B" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="292" y="88" width="60" height="44" rx="5" fill="#fff4e6" stroke="#F97316" stroke-width="2"/>
    <text x="322" y="116" text-anchor="middle" font-style="italic">N(s)</text>
    <line x1="352" y1="110" x2="401" y2="110" stroke="#0B132B" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="377" y="101" text-anchor="middle" font-style="italic">m<tspan baseline-shift="sub" font-size="75%">d</tspan></text>
    <rect x="402" y="88" width="66" height="44" rx="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="435" y="116" text-anchor="middle" font-style="italic">V<tspan baseline-shift="sub" font-size="75%">cc</tspan>/2</text>
    <line x1="468" y1="110" x2="531" y2="110" stroke="#0B132B" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="498" y="101" text-anchor="middle" font-style="italic">v<tspan baseline-shift="sub" font-size="75%">inv,d</tspan></text>
    <rect x="532" y="88" width="100" height="44" rx="5" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
    <text x="582" y="116" text-anchor="middle" font-style="italic">1/(Ls + R)</text>
    <line x1="632" y1="110" x2="706" y2="110" stroke="#0B132B" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="690" y="101" text-anchor="middle" font-style="italic">i<tspan baseline-shift="sub" font-size="75%">d</tspan></text>
    <circle cx="662" cy="110" r="3" fill="#0B132B"/>

    <!-- ===================== eixo q (y = 240) ===================== -->
    <text x="12" y="234" font-style="italic">i<tspan baseline-shift="sub" font-size="75%">q,ref</tspan></text>
    <line x1="58" y1="240" x2="87" y2="240" stroke="#0B132B" stroke-width="1.5" marker-end="url(#arr)"/>
    <use href="#sum" x="100" y="240"/>
    <text x="76" y="234" font-size="13" font-weight="700">+</text>
    <text x="106" y="270" font-size="15" font-weight="700">−</text>
    <line x1="111" y1="240" x2="139" y2="240" stroke="#0B132B" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="125" y="226" font-size="13" font-style="italic" text-anchor="middle">e<tspan baseline-shift="sub" font-size="75%">q</tspan></text>
    <rect x="140" y="218" width="130" height="44" rx="5" fill="#fff4e6" stroke="#F97316" stroke-width="2"/>
    <text x="205" y="246" text-anchor="middle" font-style="italic">K<tspan baseline-shift="sub" font-size="75%">p</tspan>/4 + K<tspan baseline-shift="sub" font-size="75%">i</tspan>/(4s)</text>
    <line x1="270" y1="240" x2="291" y2="240" stroke="#0B132B" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="292" y="218" width="60" height="44" rx="5" fill="#fff4e6" stroke="#F97316" stroke-width="2"/>
    <text x="322" y="246" text-anchor="middle" font-style="italic">N(s)</text>
    <line x1="352" y1="240" x2="401" y2="240" stroke="#0B132B" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="377" y="231" text-anchor="middle" font-style="italic">m<tspan baseline-shift="sub" font-size="75%">q</tspan></text>
    <rect x="402" y="218" width="66" height="44" rx="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="435" y="246" text-anchor="middle" font-style="italic">V<tspan baseline-shift="sub" font-size="75%">cc</tspan>/2</text>
    <line x1="468" y1="240" x2="531" y2="240" stroke="#0B132B" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="498" y="231" text-anchor="middle" font-style="italic">v<tspan baseline-shift="sub" font-size="75%">inv,q</tspan></text>
    <rect x="532" y="218" width="100" height="44" rx="5" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
    <text x="582" y="246" text-anchor="middle" font-style="italic">1/(Ls + R)</text>
    <line x1="632" y1="240" x2="706" y2="240" stroke="#0B132B" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="690" y="231" text-anchor="middle" font-style="italic">i<tspan baseline-shift="sub" font-size="75%">q</tspan></text>
    <circle cx="662" cy="240" r="3" fill="#0B132B"/>

    <!-- ===================== realimentações ===================== -->
    <path d="M 662 110 L 662 50 L 100 50 L 100 98" fill="none" stroke="#1971c2" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrB)"/>
    <path d="M 662 240 L 662 290 L 100 290 L 100 252" fill="none" stroke="#1971c2" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrB)"/>

    <!-- ===================== grupos (estilo Yazdani) ===================== -->
    <g stroke="#6b7280" stroke-width="1.2" fill="none">
      <path d="M 88 306 L 88 312 L 356 312 L 356 306"/>
      <path d="M 400 306 L 400 312 L 470 312 L 470 306"/>
      <path d="M 528 306 L 528 312 L 636 312 L 636 306"/>
    </g>
    <g font-size="13" fill="#4b5563" text-anchor="middle">
      <text x="222" y="329">controlador de corrente dq</text>
      <text x="435" y="329">VSI</text>
      <text x="582" y="329">lado CA</text>
    </g>
    <text x="360" y="362" font-size="13" font-style="italic" fill="#4b5563" text-anchor="middle">L = L<tspan baseline-shift="sub" font-size="75%">1</tspan> + L<tspan baseline-shift="sub" font-size="75%">2</tspan>;&#8195;R = R<tspan baseline-shift="sub" font-size="75%">1</tspan> + R<tspan baseline-shift="sub" font-size="75%">2</tspan>;&#8195;N(s): filtro <tspan font-style="normal">notch</tspan></text>
  </g>
</svg>
