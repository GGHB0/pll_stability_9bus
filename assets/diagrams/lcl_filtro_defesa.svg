<svg xmlns="http://www.w3.org/2000/svg" viewBox="-84 0 764 330" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <!-- Slide "Filtro LCL" da defesa: equivalente por fase (VSI, Rd1-L1, Rd3-C, L2-Rd2, PCC, rede)
       e régua de frequência com rede, ressonância e chaveamento. Valores só os do TCC. -->
  <defs>
    <marker id="arrN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0B132B"/>
    </marker>
  </defs>
  <rect x="-84" y="0" width="764" height="330" fill="#ffffff"/>

  <!-- filtro: moldura tracejada âmbar -->
  <rect x="122" y="22" width="352" height="178" rx="8" fill="#fef3c7" fill-opacity="0.45" stroke="#b45309" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text x="134" y="44" font-size="19" font-weight="700" fill="#b45309">Filtro LCL</text>


  <!-- barramento CC -->
  <g stroke="#166534" stroke-width="2.2" fill="none">
    <line x1="-52" y1="80" x2="14" y2="80"/>
    <line x1="-52" y1="116" x2="14" y2="116"/>
    <line x1="-52" y1="80" x2="-52" y2="88"/>
    <line x1="-66" y1="88" x2="-38" y2="88" stroke-width="3.4"/>
    <line x1="-59" y1="95" x2="-45" y2="95"/>
    <line x1="-66" y1="102" x2="-38" y2="102" stroke-width="3.4"/>
    <line x1="-59" y1="109" x2="-45" y2="109"/>
    <line x1="-52" y1="109" x2="-52" y2="116"/>
  </g>
  <text x="-14" y="105" font-size="20" fill="#166534" font-style="italic" text-anchor="middle">V<tspan baseline-shift="sub" font-size="72%">cc</tspan></text>
  <text x="-34" y="146" font-size="18" fill="#166534" text-anchor="middle">constante</text>
  <!-- VSI -->
  <rect x="14" y="66" width="92" height="64" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="60" y="96" font-size="21" font-weight="700" fill="#1d4ed8" text-anchor="middle">VSI</text>
  <text x="60" y="120" font-size="18" fill="#1d4ed8" text-anchor="middle">5 kHz</text>

  <g stroke="#0B132B" stroke-width="2.2" fill="none">
    <!-- ramo série: VSI → Rd1 → L1 → nó -->
    <line x1="106" y1="98" x2="140" y2="98"/>
    <path d="M 140 98 l 4 -8 l 8 16 l 8 -16 l 8 16 l 8 -16 l 4 8"/>
    <line x1="180" y1="98" x2="192" y2="98"/>
    <path d="M 192 98 q 8 -14 16 0 q 8 -14 16 0 q 8 -14 16 0 q 8 -14 16 0"/>
    <line x1="256" y1="98" x2="298" y2="98"/>
    <!-- ramo série: nó → L2 → Rd2 → PCC -->
    <line x1="298" y1="98" x2="336" y2="98"/>
    <path d="M 336 98 q 8 -14 16 0 q 8 -14 16 0 q 8 -14 16 0 q 8 -14 16 0"/>
    <line x1="400" y1="98" x2="412" y2="98"/>
    <path d="M 412 98 l 4 -8 l 8 16 l 8 -16 l 8 16 l 8 -16 l 4 8"/>
    <line x1="452" y1="98" x2="512" y2="98"/>
    <!-- ramo paralelo: nó → Rd3 → C → terra -->
    <line x1="298" y1="98" x2="298" y2="112"/>
    <path d="M 298 112 l -8 4 l 16 8 l -16 8 l 16 8 l -8 4"/>
    <line x1="298" y1="144" x2="298" y2="154"/>
    <line x1="282" y1="154" x2="314" y2="154" stroke-width="3"/>
    <line x1="282" y1="163" x2="314" y2="163" stroke-width="3"/>
    <line x1="298" y1="163" x2="298" y2="176"/>
    <line x1="284" y1="176" x2="312" y2="176"/>
    <line x1="289" y1="182" x2="307" y2="182"/>
    <line x1="294" y1="188" x2="302" y2="188"/>
    <!-- PCC → rede -->
    <line x1="512" y1="98" x2="576" y2="98"/>
    <circle cx="604" cy="98" r="28"/>
    <path d="M 588 98 q 8 -14 16 0 q 8 14 16 0"/>
  </g>
  <circle cx="298" cy="98" r="4" fill="#0B132B"/>
  <!-- PCC -->
  <line x1="512" y1="62" x2="512" y2="134" stroke="#EA580C" stroke-width="6"/>
  <text x="512" y="54" font-size="17" font-weight="700" fill="#EA580C" text-anchor="middle">PCC</text>
  <text x="604" y="152" font-size="18" font-weight="700" fill="#0B132B" text-anchor="middle">Rede</text>

  <!-- rótulos dos componentes -->
  <g font-size="20" fill="#0B132B" font-style="italic" text-anchor="middle">
    <text x="160" y="78">R<tspan baseline-shift="sub" font-size="72%">d1</tspan></text>
    <text x="224" y="78">L<tspan baseline-shift="sub" font-size="72%">1</tspan></text>
    <text x="368" y="78">L<tspan baseline-shift="sub" font-size="72%">2</tspan></text>
    <text x="432" y="78">R<tspan baseline-shift="sub" font-size="72%">d2</tspan></text>
    <text x="336" y="134">R<tspan baseline-shift="sub" font-size="72%">d3</tspan></text>
    <text x="330" y="166">C</text>
  </g>
  <text x="464" y="44" font-size="18" fill="#64748B" font-style="italic" text-anchor="end">equivalente por fase</text>

  <!-- régua de frequência (escala log) -->
  <line x1="40" y1="286" x2="652" y2="286" stroke="#0B132B" stroke-width="2" marker-end="url(#arrN)"/>
  <text x="660" y="292" font-size="19" fill="#0B132B" font-style="italic">f</text>
  <!-- pico de ressonância -->
  <path d="M 392 284 C 440 284, 448 252, 462 250 C 476 252, 484 284, 532 284" stroke="#b45309" stroke-width="2.4" fill="none"/>
  <g>
    <circle cx="128" cy="286" r="6" fill="#0B132B"/>
    <text x="128" y="316" font-size="18" fill="#0B132B" text-anchor="middle">rede, 60 Hz</text>
    <circle cx="462" cy="286" r="6" fill="#b45309"/>
    <text x="462" y="242" font-size="18" fill="#b45309" text-anchor="middle" font-weight="700">ressonância, <tspan font-style="italic">ω</tspan><tspan baseline-shift="sub" font-size="72%">res</tspan></text>
    <circle cx="592" cy="286" r="6" fill="#1d4ed8"/>
    <text x="592" y="316" font-size="18" fill="#1d4ed8" text-anchor="middle">chaveamento, 5 kHz</text>
  </g>
</svg>
