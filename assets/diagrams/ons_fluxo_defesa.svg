<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <!-- Lógica do Submódulo 2.10 (função ONS_2_11) em fluxograma, na ordem do código:
       if V < 0,85 / elseif V > 1,1 / else; saturação ±Imax; id = min(id,nom, √(Imax² − iq²)).
       Rampa de subtensão com os pontos do TCC (§5.2); sobretensão pela Figura 2.2
       (até 1,2 pu); sem as inclinações do código, sem fault_flag e sem Vnom.
       Par do ons_logica_defesa.svg (gráficos). Deck da defesa (2026-10-21). -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0B132B"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1971c2"/>
    </marker>
  </defs>
  <rect width="900" height="290" fill="#ffffff"/>

  <g font-size="15" fill="#0B132B">
    <!-- entrada -->
    <text x="6" y="56" font-style="italic" font-size="16" fill="#1971c2">V<tspan baseline-shift="sub" font-size="75%">PCC</tspan></text>
    <line x1="54" y1="62" x2="78" y2="62" stroke="#1971c2" stroke-width="1.6" marker-end="url(#arrB)"/>

    <!-- decisões -->
    <polygon points="80,62 150,30 220,62 150,94" fill="#ffffff" stroke="#0B132B" stroke-width="1.8"/>
    <text x="150" y="67" text-anchor="middle"><tspan font-style="italic">V</tspan> &lt; 0,85?</text>
    <polygon points="80,160 150,128 220,160 150,192" fill="#ffffff" stroke="#0B132B" stroke-width="1.8"/>
    <text x="150" y="165" text-anchor="middle"><tspan font-style="italic">V</tspan> &gt; 1,1?</text>
    <line x1="150" y1="94" x2="150" y2="126" stroke="#0B132B" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="158" y="116" font-size="13" fill="#64748B">não</text>
    <polyline points="150,192 150,252 248,252" fill="none" stroke="#0B132B" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="158" y="216" font-size="13" fill="#64748B">não</text>
    <line x1="220" y1="62" x2="248" y2="62" stroke="#0B132B" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="232" y="54" font-size="13" text-anchor="middle" fill="#64748B">sim</text>
    <line x1="220" y1="160" x2="248" y2="160" stroke="#0B132B" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="232" y="152" font-size="13" text-anchor="middle" fill="#64748B">sim</text>

    <!-- caminhos -->
    <rect x="250" y="34" width="232" height="56" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/>
    <text x="366" y="56" text-anchor="middle" font-weight="700">Subtensão: injeta reativo</text>
    <text x="366" y="78" text-anchor="middle"><tspan font-style="italic">i<tspan baseline-shift="sub" font-size="75%">q</tspan></tspan> = (0,85 − <tspan font-style="italic">V</tspan>) / 0,35</text>
    <rect x="250" y="132" width="232" height="56" rx="6" fill="#fff7ed" stroke="#b45309" stroke-width="1.8"/>
    <text x="366" y="154" text-anchor="middle" font-weight="700">Sobretensão: absorve</text>
    <text x="366" y="176" text-anchor="middle" font-size="14">rampa da Figura 2.2 até 1,2 pu</text>
    <rect x="250" y="224" width="232" height="56" rx="6" fill="#f0fdf4" stroke="#166534" stroke-width="1.8"/>
    <text x="366" y="246" text-anchor="middle" font-weight="700">Faixa normal</text>
    <text x="366" y="268" text-anchor="middle"><tspan font-style="italic">i<tspan baseline-shift="sub" font-size="75%">q</tspan></tspan> = 0 e <tspan font-style="italic">i<tspan baseline-shift="sub" font-size="75%">d</tspan></tspan> = <tspan font-style="italic">i<tspan baseline-shift="sub" font-size="75%">d,nom</tspan></tspan></text>

    <!-- junção dos caminhos de falta -->
    <polyline points="482,62 510,62 510,111 528,111" fill="none" stroke="#0B132B" stroke-width="1.6" marker-end="url(#arr)"/>
    <polyline points="482,160 510,160 510,111" fill="none" stroke="#0B132B" stroke-width="1.6"/>
    <rect x="530" y="86" width="118" height="50" rx="6" fill="#ffffff" stroke="#0B132B" stroke-width="1.8"/>
    <text x="589" y="107" text-anchor="middle" font-weight="700">Limita <tspan font-style="italic">i<tspan baseline-shift="sub" font-size="75%">q</tspan></tspan></text>
    <text x="589" y="127" text-anchor="middle" font-size="14">a ±<tspan font-style="italic">I<tspan baseline-shift="sub" font-size="75%">max</tspan></tspan></text>
    <line x1="648" y1="111" x2="676" y2="111" stroke="#0B132B" stroke-width="1.6" marker-end="url(#arr)"/>
    <rect x="678" y="72" width="214" height="78" rx="6" fill="#fff4e6" stroke="#F97316" stroke-width="2.5"/>
    <text x="785" y="94" text-anchor="middle" font-weight="700">Prioridade ao reativo</text>
    <text x="785" y="116" text-anchor="middle" font-size="14"><tspan font-style="italic">i<tspan baseline-shift="sub" font-size="75%">d</tspan></tspan> = menor entre <tspan font-style="italic">i<tspan baseline-shift="sub" font-size="75%">d,nom</tspan></tspan></text>
    <text x="785" y="138" text-anchor="middle" font-size="14">e o que cabe em <tspan font-style="italic">I<tspan baseline-shift="sub" font-size="75%">max</tspan></tspan></text>

    <!-- saída -->
    <line x1="785" y1="150" x2="785" y2="222" stroke="#0B132B" stroke-width="1.6" marker-end="url(#arr)"/>
    <line x1="482" y1="252" x2="698" y2="252" stroke="#0B132B" stroke-width="1.6" marker-end="url(#arr)"/>
    <rect x="700" y="224" width="192" height="56" rx="6" fill="#0B132B"/>
    <text x="796" y="248" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan font-style="italic">i<tspan baseline-shift="sub" font-size="75%">d,ref</tspan></tspan> e <tspan font-style="italic">i<tspan baseline-shift="sub" font-size="75%">q,ref</tspan></tspan></text>
    <text x="796" y="270" text-anchor="middle" font-size="13" fill="#cbd5e1">para a malha de corrente</text>
  </g>
</svg>
