<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 510" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <!-- Versão TCC (Figura 2.2): sem título nem legenda internos, que ficam no Word.
       Escala: x = 80 + 380*V ; y = 250 - 150*(dIq/In). -->
  <defs>
    <marker id="arrAxisQ" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
  </defs>

  <rect width="740" height="510" fill="#ffffff"/>

  <!-- Zonas de tensão -->
  <rect x="80" y="45" width="323" height="395" fill="#e7f5ff"/>
  <rect x="403" y="45" width="95" height="395" fill="#fff3bf"/>
  <rect x="498" y="45" width="162" height="395" fill="#fff4e6"/>

  <!-- Guias tracejadas -->
  <g stroke="#6b7280" stroke-width="1" stroke-dasharray="4,3">
    <line x1="80" y1="100" x2="270" y2="100"/>
    <line x1="270" y1="100" x2="270" y2="250"/>
    <line x1="536" y1="250" x2="536" y2="400"/>
    <line x1="80" y1="400" x2="536" y2="400"/>
  </g>

  <!-- Eixos -->
  <line x1="80" y1="455" x2="80" y2="32" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrAxisQ)"/>
  <line x1="60" y1="250" x2="690" y2="250" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrAxisQ)"/>
  <text x="90" y="28" font-size="15" font-style="italic" fill="#0B132B">ΔI<tspan baseline-shift="sub" font-size="75%">Q</tspan> / I<tspan baseline-shift="sub" font-size="75%">n</tspan></text>
  <text x="696" y="255" font-size="15" font-style="italic" fill="#0B132B">V (pu)</text>

  <!-- Curva -->
  <path d="M 80 100 L 270 100 L 403 250 L 498 250 L 536 400 L 660 400" fill="none" stroke="#1971c2" stroke-width="3"/>

  <!-- Marcas -->
  <line x1="75" y1="100" x2="80" y2="100" stroke="#1f2937" stroke-width="1.5"/>
  <text x="70" y="105" text-anchor="end" font-size="14" fill="#0B132B">+1</text>
  <line x1="75" y1="400" x2="80" y2="400" stroke="#1f2937" stroke-width="1.5"/>
  <text x="70" y="405" text-anchor="end" font-size="14" fill="#0B132B">−1</text>
  <g stroke="#1f2937" stroke-width="1.5">
    <line x1="270" y1="250" x2="270" y2="256"/>
    <line x1="403" y1="250" x2="403" y2="256"/>
    <line x1="498" y1="250" x2="498" y2="256"/>
  </g>
  <g font-size="14" fill="#0B132B">
    <text x="270" y="272" text-anchor="middle">V1 = 0,5</text>
    <text x="398" y="272" text-anchor="end">0,85</text>
    <text x="493" y="272" text-anchor="end">1,10</text>
    <text x="536" y="424" text-anchor="middle">V2 = 1,2</text>
  </g>

  <!-- Rótulos das zonas -->
  <text x="240" y="330" text-anchor="middle" font-size="15" font-weight="700" fill="#1864ab">Subtensão (V &lt; 0,85 pu)</text>
  <text x="240" y="350" text-anchor="middle" font-size="14" fill="#1864ab">injeção de corrente reativa</text>
  <text x="240" y="368" text-anchor="middle" font-size="14" fill="#1864ab">(fornecimento de reativos)</text>

  <text x="450" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#8a6d00">Banda</text>
  <text x="450" y="158" text-anchor="middle" font-size="15" font-weight="700" fill="#8a6d00">morta</text>
  <text x="450" y="178" text-anchor="middle" font-size="13" fill="#8a6d00">sem injeção</text>
  <text x="450" y="194" text-anchor="middle" font-size="13" fill="#8a6d00">adicional</text>

  <text x="579" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#c2410c">Sobretensão</text>
  <text x="579" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#c2410c">(V &gt; 1,10 pu)</text>
  <text x="579" y="158" text-anchor="middle" font-size="14" fill="#c2410c">absorção de</text>
  <text x="579" y="175" text-anchor="middle" font-size="14" fill="#c2410c">corrente reativa</text>

  <!-- Definições -->
  <text x="20" y="478" font-size="13" font-style="italic" fill="#374151">ΔI<tspan baseline-shift="sub" font-size="75%">Q</tspan> = I<tspan baseline-shift="sub" font-size="75%">Q</tspan> − I<tspan baseline-shift="sub" font-size="75%">Q0</tspan>: corrente reativa adicional à de pré-distúrbio; I<tspan baseline-shift="sub" font-size="75%">n</tspan>: corrente nominal</text>
  <text x="20" y="498" font-size="13" font-style="italic" fill="#374151">V: tensão de sequência positiva nos terminais; V1 e V2 com os ajustes padrão do ONS</text>
</svg>
