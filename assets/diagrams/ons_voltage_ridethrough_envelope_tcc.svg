<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 490" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <!-- Versão TCC (Figura 2.1): sem título nem legenda internos, que ficam no Word.
       Escala: V -> y = 430 - 300*V ; t esquemático (0->80, 0,5->170, 1->240, 2,5->400, 5->540). -->
  <defs>
    <marker id="arrAxisV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
  </defs>

  <rect width="740" height="490" fill="#ffffff"/>

  <!-- Fora do envelope: desconexão permitida -->
  <rect x="80" y="40" width="580" height="390" fill="#fdecec"/>

  <!-- Dentro do envelope: permanência obrigatória (borda direita aberta = continua) -->
  <path d="M 80 70 L 400 70 L 400 100 L 660 100 L 660 160 L 540 160 L 540 175 L 240 175 L 170 370 L 80 370 Z"
        fill="#d3f0dc"/>
  <path d="M 80 70 L 400 70 L 400 100 L 660 100" fill="none" stroke="#0B132B" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M 80 370 L 170 370 L 240 175 L 540 175 L 540 160 L 660 160" fill="none" stroke="#0B132B" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- Guias tracejadas (do envelope até o eixo t) -->
  <g stroke="#6b7280" stroke-width="1" stroke-dasharray="4,3">
    <line x1="170" y1="370" x2="170" y2="430"/>
    <line x1="240" y1="175" x2="240" y2="430"/>
    <line x1="400" y1="175" x2="400" y2="430"/>
    <line x1="540" y1="175" x2="540" y2="430"/>
  </g>

  <!-- Rótulos das regiões (fundo sólido interrompe as guias) -->
  <rect x="370" y="282" width="200" height="44" fill="#fdecec"/>
  <g paint-order="stroke" stroke-width="5" stroke-linejoin="round" text-anchor="middle">
    <text x="320" y="128" font-size="15" font-weight="700" fill="#166534" stroke="#d3f0dc">Permanência obrigatória</text>
    <text x="320" y="148" font-size="14" fill="#166534" stroke="#d3f0dc">(a central não pode se desconectar)</text>
    <text x="470" y="300" font-size="15" font-weight="700" fill="#c92a2a" stroke="#fdecec">Desconexão permitida</text>
    <text x="470" y="319" font-size="14" fill="#c92a2a" stroke="#fdecec">(tensão abaixo do envelope)</text>
    <text x="505" y="60" font-size="14" fill="#c92a2a" stroke="#fdecec">Desconexão permitida (tensão acima do envelope)</text>
  </g>

  <!-- Eixos -->
  <line x1="80" y1="445" x2="80" y2="28" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrAxisV)"/>
  <line x1="60" y1="430" x2="690" y2="430" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrAxisV)"/>
  <text x="88" y="24" font-size="15" font-style="italic" fill="#0B132B">Tensão (pu)</text>
  <text x="696" y="435" font-size="15" font-style="italic" fill="#0B132B">t (s)</text>

  <!-- Marcas do eixo V -->
  <g font-size="14" fill="#0B132B" text-anchor="end">
    <text x="72" y="75">1,2</text>
    <text x="72" y="105">1,1</text>
    <text x="72" y="135">1,0</text>
    <text x="72" y="162">0,9</text>
    <text x="72" y="182">0,85</text>
    <text x="72" y="375">0,2</text>
  </g>

  <!-- Marcas do eixo t -->
  <g font-size="14" fill="#0B132B" text-anchor="middle">
    <text x="80" y="452">0</text>
    <text x="170" y="452">0,5</text>
    <text x="240" y="452">1</text>
    <text x="400" y="452">2,5</text>
    <text x="540" y="452">5</text>
  </g>
  <text x="80" y="474" font-size="13" font-style="italic" fill="#374151">↑ início do distúrbio</text>
</svg>
