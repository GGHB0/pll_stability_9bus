<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="680" height="350" fill="#ffffff"/>

  <text x="340" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#0B132B">
    SRF-PLL: diagrama de blocos do laço de controle (tipo 2)
  </text>

  <!-- ============= Input: three sinusoids u_abc ============= -->
  <g transform="translate(26,149)">
    <path d="M 0 -20 q 5 -8 10 0 q 5 8 10 0 q 5 -8 10 0 q 5 8 10 0" fill="none" stroke="#c92a2a" stroke-width="1.5"/>
    <path d="M 0 0   q 5 -8 10 0 q 5 8 10 0 q 5 -8 10 0 q 5 8 10 0" fill="none" stroke="#2f9e44" stroke-width="1.5"/>
    <path d="M 0 20  q 5 -8 10 0 q 5 8 10 0 q 5 -8 10 0 q 5 8 10 0" fill="none" stroke="#1971c2" stroke-width="1.5"/>
    <text x="20" y="48" text-anchor="middle" font-size="14" font-style="italic" fill="#0B132B">u<tspan baseline-shift="sub" font-size="75%">abc</tspan>(t)</text>
  </g>
  <line x1="70" y1="149" x2="90" y2="149" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ============= Park transform block ============= -->
  <rect x="92" y="116" width="104" height="66" fill="#e7f5ff" stroke="#1971c2" stroke-width="2" rx="5"/>
  <text x="144" y="139" text-anchor="middle" font-size="14" font-weight="700" fill="#0B132B">Transformada</text>
  <text x="144" y="156" text-anchor="middle" font-size="14" font-weight="700" fill="#0B132B">de Park</text>
  <text x="144" y="174" text-anchor="middle" font-size="13" fill="#0B132B">abc → dqo</text>

  <!-- Output u_d (monitor tap, routed up) -->
  <path d="M 196 129 L 222 129 L 222 106" fill="none" stroke="#1f2937" stroke-width="1.5"/>
  <text x="230" y="110" font-size="13" font-style="italic" fill="#0B132B">u<tspan baseline-shift="sub" font-size="75%">d</tspan> ≈ U (amplitude)</text>

  <!-- Output u_q (main signal) -->
  <line x1="196" y1="169" x2="306" y2="169" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="250" y="158" text-anchor="middle" font-size="14" font-style="italic" fill="#0B132B">u<tspan baseline-shift="sub" font-size="75%">q</tspan></text>

  <!-- ============= PI controller (transfer function) ============= -->
  <rect x="310" y="147" width="112" height="44" fill="#e6fcf5" stroke="#0ca678" stroke-width="2" rx="5"/>
  <text x="366" y="175" text-anchor="middle" font-size="17" font-weight="700" fill="#0B132B">K<tspan baseline-shift="sub" font-size="75%">p</tspan> + K<tspan baseline-shift="sub" font-size="75%">i</tspan> / s</text>
  <text x="366" y="209" text-anchor="middle" font-size="13" fill="#6b7280">controlador PI</text>

  <line x1="422" y1="169" x2="470" y2="169" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ============= Summing junction ============= -->
  <circle cx="482" cy="169" r="13" fill="white" stroke="#1f2937" stroke-width="2"/>
  <line x1="472" y1="169" x2="492" y2="169" stroke="#1f2937" stroke-width="1"/>
  <line x1="482" y1="159" x2="482" y2="179" stroke="#1f2937" stroke-width="1"/>
  <text x="462" y="164" font-size="13" font-weight="700" fill="#0B132B">+</text>
  <text x="474" y="196" font-size="13" font-weight="700" fill="#0B132B">+</text>

  <!-- ============= omega_n feed-forward ============= -->
  <rect x="434" y="70" width="96" height="30" fill="white" stroke="#1f2937" stroke-width="1.5" rx="4"/>
  <text x="482" y="90" text-anchor="middle" font-size="14" font-style="italic" fill="#0B132B">ω<tspan baseline-shift="sub" font-size="75%">n</tspan> = 2π·60</text>
  <line x1="482" y1="100" x2="482" y2="155" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="540" y="110" font-size="13" font-style="italic" fill="#6b7280">feed-forward</text>

  <!-- ============= After sum → omega_PLL → integrator ============= -->
  <line x1="495" y1="169" x2="545" y2="169" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="520" y="160" text-anchor="middle" font-size="14" font-style="italic" fill="#0B132B">ω<tspan baseline-shift="sub" font-size="75%">PLL</tspan></text>

  <!-- ============= Integrator (1/s) — VCO ============= -->
  <rect x="545" y="147" width="58" height="44" fill="#fff3bf" stroke="#c79c00" stroke-width="2" rx="5"/>
  <text x="574" y="176" text-anchor="middle" font-size="18" font-weight="700" fill="#0B132B">1 / s</text>
  <text x="574" y="209" text-anchor="middle" font-size="13" fill="#6b7280">integrador (VCO)</text>

  <line x1="603" y1="169" x2="655" y2="169" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="630" y="159" text-anchor="middle" font-size="15" font-weight="700" font-style="italic" fill="#7c3aed">θ<tspan baseline-shift="sub" font-size="75%">PLL</tspan>(t)</text>

  <!-- ============= Feedback loop (dashed, purple) ============= -->
  <path d="M 655 169 L 666 169 L 666 256 L 144 256 L 144 182"
        fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrP)"/>
  <text x="390" y="272" text-anchor="middle" font-size="13" font-style="italic" fill="#7c3aed">realimentação de fase (θ<tspan baseline-shift="sub" font-size="75%">PLL</tspan> → Park)</text>

  <!-- Bottom note: gains + characteristic equation -->
  <line x1="30" y1="289" x2="650" y2="289" stroke="#e5e7eb" stroke-width="1"/>
  <text x="340" y="310" text-anchor="middle" font-size="13" font-style="italic" fill="#0B132B">
    K<tspan baseline-shift="sub" font-size="75%">p</tspan> = 8·f<tspan baseline-shift="sub" font-size="75%">g</tspan>·(L₁+L₂+L<tspan baseline-shift="sub" font-size="75%">est</tspan>)   ·   K<tspan baseline-shift="sub" font-size="75%">i</tspan> = 32·f<tspan baseline-shift="sub" font-size="75%">g</tspan>²·(L₁+L₂+L<tspan baseline-shift="sub" font-size="75%">est</tspan>)
  </text>
  <text x="340" y="336" text-anchor="middle" font-size="13" font-style="italic" fill="#0B132B">
    equação característica:  s² + K<tspan baseline-shift="sub" font-size="75%">p</tspan>·U·s + K<tspan baseline-shift="sub" font-size="75%">i</tspan>·U = 0
  </text>
</svg>
