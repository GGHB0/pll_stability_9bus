<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 280" font-family="Calibri, Carlito, sans-serif" fill="#0F172A">
  <!-- Fig. 4.3 do TCC redesenhada para o slide 6 da defesa: caixa 7,53 x 1,87 in (150 un/in, 1 un = 0,48 pt).
       Sem título interno e sem as equações (ficam num cartão de texto à direita, no slide). -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1E3A8A"/>
    </marker>
    <marker id="arrL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#EA580C"/>
    </marker>
  </defs>
  <rect width="1130" height="280" fill="#ffffff"/>

  <!-- entrada v_abc -->
  <g transform="translate(14,130)" fill="none" stroke-width="2.6">
    <path d="M 0 -26 q 8 -12 16 0 q 8 12 16 0 q 8 -12 16 0 q 8 12 16 0" stroke="#DC2626"/>
    <path d="M 0 0 q 8 -12 16 0 q 8 12 16 0 q 8 -12 16 0 q 8 12 16 0" stroke="#16A34A"/>
    <path d="M 0 26 q 8 -12 16 0 q 8 12 16 0 q 8 -12 16 0 q 8 12 16 0" stroke="#2563EB"/>
  </g>
  <text x="46" y="200" text-anchor="middle" font-size="32" font-style="italic">v<tspan baseline-shift="sub" font-size="70%">abc</tspan></text>
  <line x1="84" y1="130" x2="104" y2="130" stroke="#1E3A8A" stroke-width="2.6" marker-end="url(#arr)"/>

  <!-- Park -->
  <rect x="106" y="72" width="180" height="116" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/>
  <text x="196" y="122" text-anchor="middle" font-size="38" font-weight="700">Park</text>
  <text x="196" y="164" text-anchor="middle" font-size="32">abc → dq</text>

  <!-- v_d (saída monitorada) -->
  <path d="M 286 96 L 318 96 L 318 42" fill="none" stroke="#1E3A8A" stroke-width="2.6"/>
  <text x="330" y="52" font-size="32" font-style="italic">v<tspan baseline-shift="sub" font-size="70%">d</tspan> ≈ U</text>

  <!-- v_q -->
  <line x1="286" y1="150" x2="420" y2="150" stroke="#1E3A8A" stroke-width="2.6" marker-end="url(#arr)"/>
  <text x="353" y="132" text-anchor="middle" font-size="32" font-style="italic">v<tspan baseline-shift="sub" font-size="70%">q</tspan></text>

  <!-- PI -->
  <rect x="422" y="112" width="280" height="76" rx="8" fill="#EFF6FF" stroke="#1E3A8A" stroke-width="3"/>
  <text x="562" y="162" text-anchor="middle" font-size="34" font-weight="700">K<tspan baseline-shift="sub" font-size="68%">pPLL</tspan> + K<tspan baseline-shift="sub" font-size="68%">iPLL</tspan>/s</text>
  <line x1="702" y1="150" x2="774" y2="150" stroke="#1E3A8A" stroke-width="2.6" marker-end="url(#arr)"/>

  <!-- somador -->
  <circle cx="798" cy="150" r="22" fill="#ffffff" stroke="#1E3A8A" stroke-width="2.6"/>
  <line x1="785" y1="150" x2="811" y2="150" stroke="#1E3A8A" stroke-width="2"/>
  <line x1="798" y1="137" x2="798" y2="163" stroke="#1E3A8A" stroke-width="2"/>
  <text x="750" y="190" font-size="28" font-weight="700">+</text>
  <text x="766" y="118" font-size="28" font-weight="700">+</text>

  <!-- feed-forward omega_0 -->
  <rect x="718" y="4" width="160" height="50" rx="6" fill="#ffffff" stroke="#1E3A8A" stroke-width="2.4"/>
  <text x="798" y="39" text-anchor="middle" font-size="32" font-style="italic">ω<tspan baseline-shift="sub" font-size="70%">0</tspan> = 2π·60</text>
  <line x1="798" y1="54" x2="798" y2="126" stroke="#1E3A8A" stroke-width="2.6" marker-end="url(#arr)"/>
  <text x="890" y="38" font-size="28" font-style="italic" fill="#64748B">feed-forward</text>

  <!-- omega_PLL -> VCO -->
  <line x1="820" y1="150" x2="894" y2="150" stroke="#1E3A8A" stroke-width="2.6" marker-end="url(#arr)"/>
  <text x="857" y="130" text-anchor="middle" font-size="32" font-style="italic">ω<tspan baseline-shift="sub" font-size="70%">PLL</tspan></text>
  <rect x="896" y="112" width="110" height="76" rx="8" fill="#EFF6FF" stroke="#1E3A8A" stroke-width="3"/>
  <text x="951" y="164" text-anchor="middle" font-size="40" font-weight="700">1/s</text>

  <!-- saída theta_PLL -->
  <line x1="1006" y1="150" x2="1100" y2="150" stroke="#EA580C" stroke-width="3" marker-end="url(#arrL)"/>
  <text x="1046" y="124" text-anchor="middle" font-size="34" font-weight="700" font-style="italic" fill="#EA580C"><tspan font-family="Cambria Math, Cambria, serif">θ</tspan><tspan baseline-shift="sub" font-size="68%">PLL</tspan></text>

  <!-- realimentação de fase -->
  <path d="M 1100 150 L 1118 150 L 1118 226 L 196 226 L 196 190" fill="none" stroke="#EA580C" stroke-width="2.6" stroke-dasharray="9,6" marker-end="url(#arrL)"/>
  <text x="657" y="264" text-anchor="middle" font-size="28" font-style="italic" fill="#EA580C">realimentação de fase (<tspan font-family="Cambria Math, Cambria, serif">θ</tspan><tspan baseline-shift="sub" font-size="68%">PLL</tspan> → Park)</text>
</svg>
