<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1971c2"/></marker>
    <marker id="aP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="860" height="340" fill="#ffffff"/>

  <text x="430" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#0B132B">Inversor conectado à rede: o SRF-PLL mede o PCC e orienta o controle</text>

  <!-- Fonte CC -->
  <g stroke="#0B132B" fill="none" stroke-width="2">
    <line x1="60" y1="140" x2="100" y2="140"/>
    <line x1="60" y1="205" x2="100" y2="205"/>
    <line x1="60" y1="140" x2="60" y2="160"/>
    <line x1="46" y1="160" x2="74" y2="160" stroke-width="3"/>
    <line x1="52" y1="168" x2="68" y2="168"/>
    <line x1="46" y1="176" x2="74" y2="176" stroke-width="3"/>
    <line x1="52" y1="184" x2="68" y2="184"/>
    <line x1="60" y1="184" x2="60" y2="205"/>
  </g>
  <text x="38" y="178" text-anchor="end" font-size="15" font-style="italic" fill="#0B132B">V<tspan baseline-shift="sub" font-size="70%">cc</tspan></text>

  <!-- VSI -->
  <rect x="100" y="130" width="130" height="85" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="165" y="160" text-anchor="middle" font-size="16" font-weight="700" fill="#0B132B">VSI</text>
  <text x="165" y="180" text-anchor="middle" font-size="12" fill="#0B132B">controle de</text>
  <text x="165" y="196" text-anchor="middle" font-size="12" fill="#0B132B">corrente dq</text>

  <!-- linha principal -->
  <g stroke="#0B132B" stroke-width="2" fill="none">
    <line x1="230" y1="172" x2="285" y2="172"/>
    <path d="M 285 172 q 8 -13 16 0 q 8 -13 16 0 q 8 -13 16 0 q 8 -13 16 0"/>
    <line x1="349" y1="172" x2="470" y2="172"/>
    <path d="M 470 172 q 8 -13 16 0 q 8 -13 16 0 q 8 -13 16 0 q 8 -13 16 0"/>
    <line x1="534" y1="172" x2="580" y2="172"/>
    <rect x="580" y="161" width="34" height="22" fill="#fff"/>
    <line x1="614" y1="172" x2="628" y2="172"/>
    <path d="M 628 172 q 8 -13 16 0 q 8 -13 16 0 q 8 -13 16 0"/>
    <line x1="676" y1="172" x2="740" y2="172"/>
  </g>
  <line x1="252" y1="182" x2="262" y2="162" stroke="#0B132B" stroke-width="1.5"/>
  <text x="257" y="200" text-anchor="middle" font-size="12" fill="#0B132B">3φ</text>
  <text x="317" y="152" text-anchor="middle" font-size="15" font-style="italic" fill="#0B132B">L<tspan baseline-shift="sub" font-size="70%">1</tspan></text>
  <text x="502" y="152" text-anchor="middle" font-size="15" font-style="italic" fill="#0B132B">L<tspan baseline-shift="sub" font-size="70%">2</tspan></text>
  <text x="597" y="152" text-anchor="middle" font-size="14" font-style="italic" fill="#0B132B">R<tspan baseline-shift="sub" font-size="70%">th</tspan></text>
  <text x="652" y="152" text-anchor="middle" font-size="14" font-style="italic" fill="#0B132B">L<tspan baseline-shift="sub" font-size="70%">th</tspan></text>
  <text x="628" y="210" text-anchor="middle" font-size="12" fill="#475569">Thévenin da Barra 2</text>

  <!-- Rede -->
  <circle cx="770" cy="172" r="30" fill="#fff" stroke="#0B132B" stroke-width="2"/>
  <path d="M 750 172 q 5 -12 10 0 q 5 12 10 0 q 5 -12 10 0 q 5 12 10 0" fill="none" stroke="#0B132B" stroke-width="1.6"/>
  <text x="770" y="222" text-anchor="middle" font-size="14" font-weight="700" fill="#0B132B">Rede</text>
  <text x="770" y="239" text-anchor="middle" font-size="12" fill="#475569">IEEE 9 barras</text>

  <!-- PCC e ramo do capacitor -->
  <circle cx="420" cy="172" r="5" fill="#0B132B"/>
  <text x="430" y="160" font-size="14" font-weight="700" fill="#F97316">PCC</text>
  <g stroke="#0B132B" stroke-width="2" fill="none">
    <line x1="420" y1="172" x2="420" y2="214"/>
    <line x1="403" y1="214" x2="437" y2="214" stroke-width="2.6"/>
    <line x1="403" y1="223" x2="437" y2="223" stroke-width="2.6"/>
    <line x1="420" y1="223" x2="420" y2="245"/>
    <rect x="409" y="245" width="22" height="32" fill="#fff"/>
    <line x1="420" y1="277" x2="420" y2="298"/>
    <line x1="402" y1="298" x2="438" y2="298" stroke-width="2.6"/>
    <line x1="408" y1="305" x2="432" y2="305"/>
    <line x1="414" y1="312" x2="426" y2="312"/>
  </g>
  <text x="446" y="224" font-size="15" font-style="italic" fill="#0B132B">C<tspan baseline-shift="sub" font-size="70%">f</tspan></text>
  <text x="446" y="267" font-size="15" font-style="italic" fill="#0B132B">R<tspan baseline-shift="sub" font-size="70%">d</tspan></text>

  <!-- medição de tensão no PCC → SRF-PLL -->
  <line x1="420" y1="167" x2="420" y2="106" stroke="#1971c2" stroke-width="1.6" stroke-dasharray="4,3"/>
  <circle cx="420" cy="95" r="11" fill="#fff" stroke="#1971c2" stroke-width="1.6"/>
  <text x="420" y="100" text-anchor="middle" font-size="12" font-weight="700" fill="#1971c2">V</text>
  <line x1="409" y1="95" x2="357" y2="95" stroke="#1971c2" stroke-width="1.8" marker-end="url(#aB)"/>
  <text x="384" y="85" text-anchor="middle" font-size="14" font-style="italic" fill="#1971c2">v<tspan baseline-shift="sub" font-size="70%">abc</tspan></text>

  <!-- SRF-PLL -->
  <rect x="215" y="68" width="140" height="54" rx="7" fill="#fff7ed" stroke="#F97316" stroke-width="2"/>
  <text x="285" y="91" text-anchor="middle" font-size="15" font-weight="700" fill="#0B132B">SRF-PLL</text>
  <text x="285" y="110" text-anchor="middle" font-size="12" fill="#0B132B">Park · PI · 1/s</text>

  <!-- θ_PLL → controle de corrente -->
  <path d="M 215 95 L 165 95 L 165 128" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#aP)"/>
  <text x="190" y="85" text-anchor="middle" font-size="15" font-style="italic" font-weight="600" fill="#7c3aed">θ<tspan baseline-shift="sub" font-size="70%">PLL</tspan></text>
</svg>
