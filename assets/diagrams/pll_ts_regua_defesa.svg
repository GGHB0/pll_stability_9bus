<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 735 288" font-family="Calibri, Arial, sans-serif">
<!-- Régua do tempo de acomodação do SRF-PLL (deck da defesa, slide 10; TCC §3.4) -->
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0F172A"/></marker></defs>
<rect width="735" height="288" fill="#ffffff"/>
<rect x="10" y="10" width="320" height="100" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="170.0" y="40" font-size="22" fill="#0F172A" font-weight="bold" font-style="normal" text-anchor="middle">Curto demais</text>
<text x="170.0" y="66" font-size="20" fill="#0F172A" font-weight="normal" font-style="normal" text-anchor="middle">banda larga, sensível a ruído</text>
<text x="170.0" y="92" font-size="20" fill="#0F172A" font-weight="normal" font-style="normal" text-anchor="middle">de medição e a desequilíbrio</text>
<rect x="405" y="10" width="320" height="100" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="565.0" y="40" font-size="22" fill="#0F172A" font-weight="bold" font-style="normal" text-anchor="middle">Longo demais</text>
<text x="565.0" y="66" font-size="20" fill="#0F172A" font-weight="normal" font-style="normal" text-anchor="middle">não acompanha variações</text>
<text x="565.0" y="92" font-size="20" fill="#0F172A" font-weight="normal" font-style="normal" text-anchor="middle">reais de frequência da rede</text>
<line x1="10" y1="236" x2="695" y2="236" stroke="#0F172A" stroke-width="2.5" marker-end="url(#arr)"/>
<text x="713" y="244" font-size="24" fill="#0F172A" font-weight="normal" font-style="italic" text-anchor="middle">t<tspan baseline-shift="sub" font-size="75%">s</tspan></text>
<line x1="300" y1="226" x2="300" y2="246" stroke="#0F172A" stroke-width="2.5"/>
<text x="300" y="272" font-size="20" fill="#64748B" font-weight="normal" font-style="normal" text-anchor="middle">1 período</text>
<rect x="233.0" y="132" width="250" height="76" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="358.0" y="164" font-size="26" fill="#2563EB" font-weight="bold" font-style="normal" text-anchor="middle">t<tspan baseline-shift="sub" font-size="75%">s</tspan> = 20 ms</text>
<text x="358.0" y="194" font-size="20" fill="#1E3A8A" font-weight="normal" font-style="normal" text-anchor="middle">pouco mais de um período</text>
<line x1="358.0" y1="208" x2="358.0" y2="236" stroke="#2563EB" stroke-width="2" stroke-dasharray="5 4"/>
<circle cx="358.0" cy="236" r="9" fill="#2563EB"/>
</svg>