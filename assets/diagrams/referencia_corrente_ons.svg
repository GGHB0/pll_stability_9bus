<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <!-- Referência de corrente no modelo final (Simulink): o bloco do Submódulo 2.10
       (função ONS_2_11) no lugar de Pref/Qref fixos do PSIM (referencia_corrente_psim.svg).
       Encaixe igual ao controle digital da Figura 4.2 do TCC (vsi_lcl_pwm_circuit.svg):
       abc/dq da tensão -> V_PCC -> Submódulo 2.10 (+ i_d,nom, I_max) -> i_d,ref, i_q,ref
       -> malha de corrente; theta_PLL orienta a malha. Deck da defesa, slide 12c (2026-10-21). -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0B132B"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1971c2"/>
    </marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect width="900" height="190" fill="#ffffff"/>

  <g font-size="17" fill="#0B132B">
    <!-- medição da tensão e SRF-PLL -->
    <text x="8" y="126" font-style="italic">v<tspan baseline-shift="sub" font-size="75%">abc</tspan></text>
    <line x1="48" y1="120" x2="78" y2="120" stroke="#1971c2" stroke-width="1.6" marker-end="url(#arrB)"/>
    <rect x="80" y="96" width="80" height="48" fill="#ffffff" stroke="#0B132B" stroke-width="1.8"/>
    <line x1="80" y1="144" x2="160" y2="96" stroke="#0B132B" stroke-width="1.2"/>
    <text x="86" y="114" font-size="14">abc</text>
    <text x="154" y="138" font-size="14" text-anchor="end">dq</text>
    <rect x="70" y="10" width="100" height="38" rx="5" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
    <text x="120" y="35" text-anchor="middle" font-weight="700" fill="#1971c2">SRF-PLL</text>
    <line x1="104" y1="95" x2="104" y2="50" stroke="#1971c2" stroke-width="1.6" marker-end="url(#arrB)"/>
    <text x="96" y="78" font-size="13" font-style="italic" text-anchor="end" fill="#1971c2">v<tspan baseline-shift="sub" font-size="75%">q</tspan></text>
    <line x1="136" y1="49" x2="136" y2="94" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#arrP)"/>

    <!-- θ_PLL orienta a malha de corrente -->
    <polyline points="170,30 600,30 600,48" fill="none" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#arrP)"/>
    <text x="385" y="18" text-anchor="middle" font-style="italic" fill="#7c3aed">θ<tspan baseline-shift="sub" font-size="75%">PLL</tspan></text>

    <!-- tensão medida para o bloco do ONS -->
    <line x1="160" y1="120" x2="248" y2="120" stroke="#1971c2" stroke-width="1.6" marker-end="url(#arrB)"/>
    <text x="203" y="110" text-anchor="middle" font-style="italic" fill="#1971c2">V<tspan baseline-shift="sub" font-size="75%">PCC</tspan></text>

    <!-- Submódulo 2.10 -->
    <rect x="250" y="58" width="180" height="88" rx="6" fill="#fff4e6" stroke="#F97316" stroke-width="2.5"/>
    <text x="340" y="98" text-anchor="middle" font-weight="700">Submódulo 2.10</text>
    <text x="340" y="120" text-anchor="middle" font-size="14" fill="#475569">lógica do ONS</text>
    <line x1="300" y1="182" x2="300" y2="148" stroke="#0B132B" stroke-width="1.4" marker-end="url(#arr)"/>
    <line x1="380" y1="182" x2="380" y2="148" stroke="#0B132B" stroke-width="1.4" marker-end="url(#arr)"/>
    <text x="307" y="176" font-size="14" font-style="italic">i<tspan baseline-shift="sub" font-size="75%">d,nom</tspan></text>
    <text x="387" y="176" font-size="14" font-style="italic">I<tspan baseline-shift="sub" font-size="75%">max</tspan></text>

    <!-- referências -->
    <line x1="430" y1="80" x2="518" y2="80" stroke="#0B132B" stroke-width="1.6" marker-end="url(#arr)"/>
    <line x1="430" y1="126" x2="518" y2="126" stroke="#0B132B" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="474" y="64" text-anchor="middle" font-style="italic" font-weight="700">i<tspan baseline-shift="sub" font-size="75%">d,ref</tspan></text>
    <text x="474" y="110" text-anchor="middle" font-style="italic" font-weight="700">i<tspan baseline-shift="sub" font-size="75%">q,ref</tspan></text>

    <!-- malha de corrente e PWM, agora cheios -->
    <rect x="520" y="50" width="160" height="110" rx="6" fill="#f0fdf4" stroke="#166534" stroke-width="1.8"/>
    <text x="600" y="94" text-anchor="middle">Malha de</text>
    <text x="600" y="116" text-anchor="middle">corrente</text>
    <text x="600" y="140" text-anchor="middle" font-size="13" fill="#475569">PI + notch</text>
    <line x1="680" y1="105" x2="738" y2="105" stroke="#0B132B" stroke-width="1.6" marker-end="url(#arr)"/>
    <rect x="740" y="81" width="150" height="48" rx="5" fill="#ffffff" stroke="#0B132B" stroke-width="1.8"/>
    <text x="815" y="111" text-anchor="middle">PWM e inversor</text>
  </g>
</svg>
