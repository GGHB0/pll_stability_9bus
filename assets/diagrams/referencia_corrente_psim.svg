<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <!-- Primeira versão da referência de corrente (PSIM, subcircuito Correnteref):
       Pref = degrau 0 -> 1 pu, Qref = 0, cada um dividido por v_d (DIVD1/DIVD2);
       v_d sai do Park do próprio SRF-PLL. Deck da defesa, slide 12a (2026-10-20).
       A malha de corrente fica tracejada: é o slide seguinte. -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0B132B"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1971c2"/>
    </marker>
  </defs>
  <rect width="900" height="190" fill="#ffffff"/>

  <g font-size="17" fill="#0B132B">
    <!-- potência desejada -->
    <rect x="10" y="16" width="170" height="48" rx="5" fill="#ecfdf5" stroke="#166534" stroke-width="2"/>
    <text x="24" y="46" font-style="italic" font-weight="700">P<tspan baseline-shift="sub" font-size="75%">ref</tspan></text>
    <polyline points="72,46 90,46 90,26 110,26" fill="none" stroke="#166534" stroke-width="2"/>
    <text x="118" y="42" font-size="15">1 pu</text>
    <text x="90" y="60" font-size="12" text-anchor="middle" fill="#64748B">t = 35 ms</text>
    <rect x="10" y="126" width="170" height="48" rx="5" fill="#ecfdf5" stroke="#166534" stroke-width="2"/>
    <text x="24" y="156" font-style="italic" font-weight="700">Q<tspan baseline-shift="sub" font-size="75%">ref</tspan></text>
    <text x="66" y="156" font-size="15">= 0</text>

    <!-- divisão por v_d -->
    <line x1="180" y1="40" x2="266" y2="40" stroke="#0B132B" stroke-width="1.6" marker-end="url(#arr)"/>
    <line x1="180" y1="150" x2="266" y2="150" stroke="#0B132B" stroke-width="1.6" marker-end="url(#arr)"/>
    <circle cx="290" cy="40" r="22" fill="#fff4e6" stroke="#F97316" stroke-width="2"/>
    <circle cx="290" cy="150" r="22" fill="#fff4e6" stroke="#F97316" stroke-width="2"/>
    <text x="290" y="48" text-anchor="middle" font-size="24">÷</text>
    <text x="290" y="158" text-anchor="middle" font-size="24">÷</text>

    <!-- SRF-PLL fornece v_d -->
    <text x="10" y="101" font-style="italic">v<tspan baseline-shift="sub" font-size="75%">abc</tspan></text>
    <line x1="52" y1="95" x2="96" y2="95" stroke="#1971c2" stroke-width="1.6" marker-end="url(#arrB)"/>
    <rect x="97" y="76" width="110" height="38" rx="5" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
    <text x="152" y="101" text-anchor="middle" font-weight="700" fill="#1971c2">SRF-PLL</text>
    <line x1="207" y1="95" x2="290" y2="95" stroke="#1971c2" stroke-width="1.6"/>
    <text x="232" y="82" font-style="italic" fill="#1971c2">v<tspan baseline-shift="sub" font-size="75%">d</tspan></text>
    <circle cx="290" cy="95" r="3.5" fill="#1971c2"/>
    <line x1="290" y1="95" x2="290" y2="63" stroke="#1971c2" stroke-width="1.6" marker-end="url(#arrB)"/>
    <line x1="290" y1="95" x2="290" y2="127" stroke="#1971c2" stroke-width="1.6" marker-end="url(#arrB)"/>
    <text x="300" y="100" font-size="13" fill="#1971c2">com v<tspan baseline-shift="sub" font-size="75%">q</tspan> = 0</text>

    <!-- referências -->
    <line x1="312" y1="40" x2="478" y2="40" stroke="#0B132B" stroke-width="1.6" marker-end="url(#arr)"/>
    <line x1="312" y1="150" x2="478" y2="150" stroke="#0B132B" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="395" y="24" text-anchor="middle" font-style="italic" font-weight="700">i<tspan baseline-shift="sub" font-size="75%">d,ref</tspan></text>
    <text x="395" y="134" text-anchor="middle" font-style="italic" font-weight="700">i<tspan baseline-shift="sub" font-size="75%">q,ref</tspan></text>

    <!-- malha de corrente (slide seguinte) -->
    <rect x="480" y="16" width="170" height="158" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6,4"/>
    <text x="565" y="88" text-anchor="middle" fill="#475569">Malha de</text>
    <text x="565" y="110" text-anchor="middle" fill="#475569">corrente</text>
    <line x1="650" y1="95" x2="728" y2="95" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arr)"/>
    <rect x="730" y="71" width="160" height="48" rx="5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6,4"/>
    <text x="810" y="101" text-anchor="middle" fill="#475569">PWM e inversor</text>
  </g>
</svg>
